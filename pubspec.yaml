name: attendance_system
description: Student Attendance Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1
  hooks_riverpod: ^2.5.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Storage (NEW: Hive instead of SharedPreferences)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.5

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.0.0
  go_router: ^16.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # NEW: For Hive adapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
